name: ghidra-cloud-decompile

on:
  workflow_dispatch:
    inputs:
      ghidra_version:
        description: "Ghidra version (asset prefix ghidra_<ver>_PUBLIC_*.zip)"
        default: "12.1.2"
        required: true
      target:
        description: "Binary to analyze"
        default: "all"
        type: choice
        options: [all, dll, exe, network]
      scope:
        description: "app = business packages only, full = all named functions, all = literally everything"
        default: "app"
        type: choice
        options: [app, full, all]
      batch_size:
        description: "Functions per DecompileBatch run"
        default: "60"
        required: true
      string_refs:
        description: "Comma-separated substrings for FindStringRefs (empty = skip)"
        default: ""
        required: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve + download Ghidra
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(python3 tools/resolve_ghidra.py "${{ inputs.ghidra_version }}")
          echo "Ghidra URL: $URL"
          curl -sSL -o /tmp/ghidra.zip "$URL"
          mkdir -p /tmp/ghidra && unzip -q /tmp/ghidra.zip -d /tmp/ghidra
          echo "GHIDRA_DIR=$(echo /tmp/ghidra/ghidra_*_PUBLIC)" >> "$GITHUB_ENV"

      - name: Pick targets
        id: pick
        run: |
          case "${{ inputs.target }}" in
            dll) echo "list=natpierce.dll" >> "$GITHUB_OUTPUT" ;;
            exe) echo "list=natpierce.exe" >> "$GITHUB_OUTPUT" ;;
            network) echo "list=network.dll" >> "$GITHUB_OUTPUT" ;;
            *) echo "list=natpierce.dll natpierce.exe network.dll" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Headless analyze + decompile
        run: |
          set -eo pipefail
          AH="$GHIDRA_DIR/support/analyzeHeadless"
          chmod +x "$AH"
          mkdir -p out proj
          : > out/RUN_SUMMARY.md
          for f in ${{ steps.pick.outputs.list }}; do
            [ -f "targets/$f" ] || { echo "SKIP missing targets/$f" | tee -a out/RUN_SUMMARY.md; continue; }
            base="$(basename "$f" | tr '.' '_')"
            echo "### $f (out prefix $base)" >> out/RUN_SUMMARY.md
            echo "== import+analyze $f ==" | tee -a out/RUN_SUMMARY.md
            "$AH" "$GITHUB_WORKSPACE/proj" "$base" \
              -Import "$GITHUB_WORKSPACE/targets/$f" -overwrite \
              2>&1 | tee out/headless-import-$base.log | tail -5
            echo "== dump funcs $f ==" | tee -a out/RUN_SUMMARY.md
            "$AH" "$GITHUB_WORKSPACE/proj" "$base" \
              -process "$f" -noanalysis \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              -postScript DumpFuncs.java "$GITHUB_WORKSPACE/out/$base-funcs.csv" \
              2>&1 | tee out/headless-funcs-$base.log | tail -3
            python3 tools/split_batches.py \
              "out/$base-funcs.csv" "out/$base-batches" \
              "${{ inputs.batch_size }}" "${{ inputs.scope }}" \
              | tee -a out/RUN_SUMMARY.md
            i=0
            for b in out/$base-batches/batch*.lst; do
              i=$((i+1))
              echo "== decompile $f batch $i ==" | tee -a out/RUN_SUMMARY.md
              "$AH" "$GITHUB_WORKSPACE/proj" "$base" \
                -process "$f" -noanalysis \
                -scriptPath "$GITHUB_WORKSPACE/scripts" \
                -postScript DecompileBatch.java "$GITHUB_WORKSPACE/$b" \
                  "$GITHUB_WORKSPACE/out/$base-decomp-$i.txt" \
                2>&1 | tee out/headless-decomp-$base-$i.log | tail -2
            done
          done
          echo "inputs: ghidra=${{ inputs.ghidra_version }} target=${{ inputs.target }} scope=${{ inputs.scope }}" >> out/RUN_SUMMARY.md
          if [ -n "${{ inputs.string_refs }}" ]; then
            IFS=',' read -ra REFS <<< "${{ inputs.string_refs }}"
            for f in ${{ steps.pick.outputs.list }}; do
              [ -f "targets/$f" ] || continue
              base="$(basename "$f" | tr '.' '_')"
              echo "== string refs $f ==" | tee -a out/RUN_SUMMARY.md
              "$AH" "$GITHUB_WORKSPACE/proj" "$base" \
                -process "$f" -noanalysis \
                -scriptPath "$GITHUB_WORKSPACE/scripts" \
                -postScript FindStringRefs.java "$GITHUB_WORKSPACE/out/$base-refs.txt" "${REFS[@]}" \
                2>&1 | tee out/headless-refs-$base.log | tail -2
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-${{ inputs.target }}-${{ inputs.scope }}
          path: out/
          retention-days: 30

  rea-1212:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install REA + Ghidra 12.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g rea-agents@3.1.0
          URL=$(python3 tools/resolve_ghidra.py "12.1.2")
          curl -sSL -o /tmp/ghidra.zip "$URL"
          mkdir -p /tmp/ghidra && unzip -q /tmp/ghidra.zip -d /tmp/ghidra
          echo "GHIDRA_INSTALL_DIR=$(echo /tmp/ghidra/ghidra_*_PUBLIC)" >> "$GITHUB_ENV"

      - name: REA inspect (bounded, evidence JSON)
        run: |
          mkdir -p out-rea
          for f in targets/natpierce.exe targets/natpierce.dll targets/network.dll; do
            [ -f "$f" ] || continue
            base=$(basename "$f" | tr . _)
            rea inspect-managed-artifact "$f" --format json > "out-rea/$base-managed.json" 2>&1 || true
            rea inventory-artifact "$f" --limit 10 > "out-rea/$base-inventory.txt" 2>&1 || true
            rea inspect "$f" --detail concise --limit 10 > "out-rea/$base-inspect.txt" 2>&1 || true
          done
          ls -la out-rea/

      - uses: actions/upload-artifact@v4
        with:
          name: rea-1212-evidence
          path: out-rea/
          retention-days: 30
